name: refresh-universe
on:
  schedule:
    - cron: "17 20 1 * *"      # 매달 1일 (한국 시간 2일 새벽)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import screener; screener.refresh_universe()"
      - name: save lists
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add universe/
          git commit -m "refresh stock universe" || exit 0
          git pull --rebase
          git push
      - name: rebuild app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml
